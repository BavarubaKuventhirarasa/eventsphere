{% extends "base.html" %}
{% block body %}
<h3>Venues</h3>
<form method="post" action="/admin/venues" class="row g-2 mb-4 card card-body">
 <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="venue_id" value="{{ v.id if v else '' }}">
 <h5>{{ 'Edit venue' if v else 'New venue' }}</h5>
 <div class="col-12 col-md-6"><input class="form-control" name="name" placeholder="Name" value="{{ v.name if v }}" required></div>
 <div class="col-12 col-md-6"><input class="form-control" name="location" placeholder="Location" value="{{ v.location if v }}"></div>
 <div class="col-6 col-md-3"><input class="form-control" type="number" min="1" name="capacity" placeholder="Capacity" value="{{ v.capacity if v }}" required></div>
 <div class="col-6 col-md-3"><input class="form-control" type="number" min="0" step="0.01" name="hourly_rate" placeholder="Hourly rate (LKR)" value="{{ v.hourly_rate if v }}" required></div>
 <div class="col-12 col-md-6"><input class="form-control" name="image_url" placeholder="Image URL" value="{{ v.image_url if v }}"></div>
 <div class="col-12"><textarea class="form-control" name="description" placeholder="Description">{{ v.description if v }}</textarea></div>
 <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="open_for_hire" value="1" id="oh" {{ 'checked' if v and v.open_for_hire }}><label class="form-check-label" for="oh">Open for private hire</label></div></div>
 <div class="col-12"><button class="btn btn-primary">Save venue</button></div>
</form>
<div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Location</th><th>Capacity</th><th>Rate/h</th><th>Hire</th><th></th></tr></thead>
{% for x in venues %}<tr><td>{{ x.name }}</td><td>{{ x.location }}</td><td>{{ x.capacity }}</td><td>{{ '%.0f'|format(x.hourly_rate) }}</td><td>{{ 'yes' if x.open_for_hire else 'no' }}</td><td><a href="/admin/venues?edit={{ x.id }}">Edit</a></td></tr>{% endfor %}
</table></div>
{% endblock %}
