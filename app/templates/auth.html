{% extends "base.html" %}
{% block body %}
<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-4">
<h3>{{ 'Create account' if mode == 'register' else 'Log in' }}</h3>
<form method="post" action="/{{ mode }}">
 <input type="hidden" name="csrf" value="{{ csrf }}">
 {% if mode == 'register' %}<div class="mb-2"><label class="form-label">Name</label><input class="form-control" name="name" required></div>{% endif %}
 <div class="mb-2"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
 <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div>
 <button class="btn btn-primary w-100">{{ 'Register' if mode == 'register' else 'Log in' }}</button>
</form>
</div></div>
{% endblock %}
