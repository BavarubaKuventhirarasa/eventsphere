{% extends "base.html" %}
{% block body %}
<h3>Upcoming events</h3>
<form class="row g-2 mb-3" method="get">
 <div class="col-12 col-md-6"><input class="form-control" name="q" value="{{ q }}" placeholder="Search by keyword"></div>
 <div class="col-8 col-md-4"><select class="form-select" name="category"><option value="">All categories</option>
  {% for c in cats %}<option {{ 'selected' if c == category }}>{{ c }}</option>{% endfor %}</select></div>
 <div class="col-4 col-md-2"><button class="btn btn-primary w-100">Search</button></div>
</form>
<div class="row g-3">
{% for e in events %}
 <div class="col-12 col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
  <span class="badge bg-secondary">{{ e.category }}</span>
  <h5 class="mt-2">{{ e.title }}</h5>
  <p class="text-muted mb-1">{{ e.start|dt }}<br>{{ e.venue.name }}</p>
  <p class="small">{{ (e.description or '')[:110] }}</p>
  <a class="btn btn-outline-primary" href="/events/{{ e.id }}">View &amp; book</a>
 </div></div></div>
{% else %}<p>No events found.</p>{% endfor %}
</div>
{% endblock %}
